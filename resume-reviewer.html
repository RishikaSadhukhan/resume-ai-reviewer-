<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResumeAI — AI Resume Reviewer</title>

  <!-- Preact + htm: no build step, works from file:// directly -->
  <script src="https://unpkg.com/preact@10/dist/preact.umd.js"></script>
  <script src="https://unpkg.com/preact@10/hooks/dist/hooks.umd.js"></script>
  <script src="https://unpkg.com/htm@3/dist/htm.umd.js"></script>

  <!-- PDF.js for client-side PDF text extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg0: #07090F;
      --bg1: #0D1320;
      --bg2: #111827;
      --bg3: #1A2234;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --accent: #6366F1;
      --accent-dim: rgba(99,102,241,0.15);
      --accent-glow: rgba(99,102,241,0.35);
      --cyan: #06B6D4;
      --cyan-dim: rgba(6,182,212,0.12);
      --text1: #EEF2FF;
      --text2: #8892A4;
      --text3: #4B5563;
      --green: #10B981;
      --green-dim: rgba(16,185,129,0.12);
      --green-border: rgba(16,185,129,0.28);
      --amber: #F59E0B;
      --amber-dim: rgba(245,158,11,0.12);
      --amber-border: rgba(245,158,11,0.28);
      --red: #EF4444;
      --red-dim: rgba(239,68,68,0.12);
      --red-border: rgba(239,68,68,0.28);
      --radius: 14px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg0);
      color: var(--text1);
      min-height: 100vh;
      background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }

    .app-shell {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* ── TOPBAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 18px var(--accent-glow);
    }
    .logo-text {
      font-size: 18px; font-weight: 700; color: var(--text1);
      letter-spacing: -0.4px;
    }
    .logo-text span { color: var(--accent); }
    .logo-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 500;
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid var(--green-border);
      border-radius: 5px;
      padding: 2px 7px;
      letter-spacing: 0.5px;
    }

    /* ── API KEY ROW ── */
    .api-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 260px;
      max-width: 500px;
    }
    .api-input-wrap { position: relative; flex: 1; }
    .api-key-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
    }
    .api-input {
      width: 100%;
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text2);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 9px 12px 9px 34px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .api-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .api-input::placeholder { color: var(--text3); }
    .api-status {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background .3s, box-shadow .3s;
    }
    .api-status.has-key { background: var(--green); box-shadow: 0 0 8px rgba(16,185,129,0.5); }
    .api-status.no-key  { background: var(--text3); }
    .api-hint {
      font-size: 11px; color: var(--text3);
      white-space: nowrap;
    }
    .api-hint a { color: var(--cyan); text-decoration: none; }
    .api-hint a:hover { text-decoration: underline; }

    /* ── MAIN GRID ── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 820px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* ── PANEL ── */
    .panel {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .panel-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── TEXTAREA ── */
    .resume-textarea {
      width: 100%;
      min-height: 260px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text1);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .resume-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .resume-textarea::placeholder { color: var(--text3); }
    .char-count {
      font-size: 11px; color: var(--text3);
      text-align: right; margin-top: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .char-count.has-text { color: var(--text2); }

    /* ── DIVIDER ── */
    .or-divider {
      display: flex; align-items: center; gap: 10px;
      margin: 14px 0;
    }
    .or-divider::before, .or-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .or-divider span {
      font-size: 11px; color: var(--text3);
      font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
    }

    /* ── DROP ZONE ── */
    .drop-zone {
      border: 1.5px dashed var(--border-hover);
      border-radius: var(--radius-sm);
      padding: 20px; text-align: center; cursor: pointer;
      transition: border-color .2s, background .2s;
      background: var(--bg2);
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .drop-zone-icon { font-size: 26px; margin-bottom: 8px; }
    .drop-zone p { font-size: 13px; color: var(--text2); }
    .drop-zone p span { color: var(--accent); font-weight: 600; }
    .drop-zone small { font-size: 11px; color: var(--text3); margin-top: 4px; display: block; }
    .pdf-success {
      display: flex; align-items: center; gap: 10px;
      background: var(--green-dim);
      border: 1px solid var(--green-border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px; color: var(--green);
    }
    .pdf-close {
      margin-left: auto; cursor: pointer;
      color: var(--text3); font-size: 18px; line-height: 1;
      background: none; border: none;
      transition: color .2s;
    }
    .pdf-close:hover { color: var(--red); }

    /* ── ROLE INPUT ── */
    .role-input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text1);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .role-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .role-input::placeholder { color: var(--text3); }
    .role-hint { font-size: 11.5px; color: var(--text3); margin-top: 8px; }
    .role-hint span { color: var(--cyan); }

    /* ── BUTTON ── */
    .analyze-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, #4F46E5 100%);
      border: none; border-radius: var(--radius-sm);
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 600; letter-spacing: -0.2px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 24px var(--accent-glow);
    }
    .analyze-btn:hover:not(:disabled) {
      opacity: 0.92; transform: translateY(-1px);
      box-shadow: 0 8px 32px var(--accent-glow);
    }
    .analyze-btn:active:not(:disabled) { transform: translateY(0); }
    .analyze-btn:disabled { opacity: 0.38; cursor: not-allowed; box-shadow: none; }

    /* ── ERROR ── */
    .error-box {
      background: var(--red-dim);
      border: 1px solid var(--red-border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 13.5px; color: #F87171;
      display: flex; gap: 10px; align-items: flex-start;
    }

    /* ── LOADING ── */
    .loading-overlay {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 24px; text-align: center;
    }
    .radar-ring {
      width: 80px; height: 80px;
      margin: 0 auto 28px; position: relative;
    }
    .radar-ring svg { width: 100%; height: 100%; animation: spin 2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .radar-inner {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .loading-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .loading-sub { font-size: 13px; color: var(--text2); margin-bottom: 28px; }
    .loading-steps { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .loading-step {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--text3); transition: color .4s;
    }
    .loading-step.active { color: var(--text1); }
    .loading-step.done   { color: var(--text2); }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--bg3); flex-shrink: 0;
      transition: background .4s, box-shadow .4s;
    }
    .loading-step.active .step-dot {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      animation: pulse-dot 1s ease-in-out infinite;
    }
    .loading-step.done .step-dot {
      background: var(--green);
      box-shadow: 0 0 8px rgba(16,185,129,0.4);
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.5); }
    }

    /* ── EMPTY STATE ── */
    .empty-panel {
      background: var(--bg1);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 64px 24px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .empty-icon { font-size: 42px; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--text2); }
    .empty-sub { font-size: 13px; color: var(--text3); max-width: 280px; line-height: 1.6; }

    /* ═══════════ RESULTS ═══════════ */
    .results-panel { display: flex; flex-direction: column; gap: 20px; }

    /* Score hero */
    .score-hero {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
    }
    .score-circle-wrap {
      flex-shrink: 0; position: relative; width: 110px; height: 110px;
    }
    .score-circle-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .score-number {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .score-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px; font-weight: 600; line-height: 1;
    }
    .score-label-small {
      font-size: 10px; color: var(--text3);
      text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;
    }
    .score-info { flex: 1; min-width: 180px; }
    .score-grade {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px;
      padding: 4px 10px; border-radius: 20px; margin-bottom: 10px;
    }
    .score-grade.excellent { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border); }
    .score-grade.good      { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber-border); }
    .score-grade.weak      { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red-border); }
    .verdict-text { font-size: 15px; font-weight: 600; line-height: 1.45; color: var(--text1); }
    .score-bar-wrap { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
    .score-bar-fill { height: 100%; border-radius: 2px; transition: width 1.2s cubic-bezier(.22,1,.36,1); }

    /* Two-col grid */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }

    /* Result card */
    .result-card {
      background: var(--bg1); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
    }
    .card-header {
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.1px;
      margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
    }
    .card-header.green  { color: var(--green); }
    .card-header.red    { color: var(--red); }
    .card-header.cyan   { color: var(--cyan); }
    .card-header.accent { color: var(--accent); }
    .card-header.amber  { color: var(--amber); }
    .item-list { display: flex; flex-direction: column; gap: 9px; }
    .item-row { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--text1); line-height: 1.5; }
    .item-bullet { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
    .item-bullet.green { background: var(--green); }
    .item-bullet.red   { background: var(--red); }

    /* ATS */
    .ats-card { background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .ats-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 560px) { .ats-sections { grid-template-columns: 1fr; } }
    .ats-group-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .ats-group-label.found   { color: var(--green); }
    .ats-group-label.missing { color: var(--red); }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px; font-weight: 500;
      padding: 4px 10px; border-radius: 20px;
    }
    .chip.found   { background: var(--green-dim); color: var(--green);  border: 1px solid var(--green-border); }
    .chip.missing { background: var(--red-dim);   color: #F87171;        border: 1px solid var(--red-border); }

    /* Summary */
    .summary-card { background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .summary-body {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 16px;
      font-size: 14px; line-height: 1.8; color: var(--text1); font-style: italic;
    }
    .copy-btn {
      margin-top: 12px;
      display: flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text2);
      font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 500;
      padding: 7px 14px; cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .copy-btn.copied { border-color: var(--green-border); color: var(--green); background: var(--green-dim); }

    /* Recommendations */
    .recs-card { background: var(--bg1); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .rec-item {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 14px; background: var(--bg2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      transition: border-color .2s;
    }
    .rec-item:hover { border-color: var(--border-hover); }
    .rec-item + .rec-item { margin-top: 10px; }
    .rec-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px; font-weight: 600; color: var(--accent);
      line-height: 1; flex-shrink: 0; width: 28px; padding-top: 2px;
    }
    .rec-text { font-size: 13.5px; color: var(--text1); line-height: 1.55; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in   { animation: fadeUp .45s ease both; }
    .fade-in-2 { animation: fadeUp .45s .1s ease both; }
    .fade-in-3 { animation: fadeUp .45s .2s ease both; }
    .fade-in-4 { animation: fadeUp .45s .3s ease both; }
    .fade-in-5 { animation: fadeUp .45s .4s ease both; }

    @keyframes ringFill { from { stroke-dashoffset: 283; } }
    .ring-animated { animation: ringFill 1.2s cubic-bezier(.22,1,.36,1) both; }

    .hidden-file { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // ── Preact + htm setup ────────────────────────────────────────
    const { h, render } = preact;
    const { useState, useRef, useEffect, useCallback } = preactHooks;
    const html = htm.bind(h);

    // ── PDF.js worker ─────────────────────────────────────────────
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // ── System prompt ─────────────────────────────────────────────
    const SYSTEM_PROMPT = `You are an expert technical recruiter and resume coach specializing in AI and tech roles. Analyze the resume provided against the target job role. Return your analysis in this exact JSON format:
{
  "overallScore": number (0-100),
  "verdict": "string (one line summary)",
  "strengths": ["array of 3-4 specific strengths"],
  "gaps": ["array of 3-4 specific missing elements"],
  "atsKeywords": {
    "found": ["keywords present in resume"],
    "missing": ["important keywords not in resume"]
  },
  "rewrittenSummary": "string (rewritten professional summary optimized for the target role)",
  "topRecommendations": ["3 prioritized action items"]
}
Return ONLY the JSON. No extra text.`;

    // ── Score Circle ──────────────────────────────────────────────
    function ScoreCircle({ score }) {
      const circumference = 2 * Math.PI * 45;
      const offset = circumference - (score / 100) * circumference;
      const color = score >= 75 ? 'var(--green)' : score >= 50 ? 'var(--amber)' : 'var(--red)';
      const grade = score >= 75 ? 'excellent' : score >= 50 ? 'good' : 'weak';
      const gradeLabel = score >= 75 ? '✦ Strong' : score >= 50 ? '◈ Moderate' : '⚠ Weak';

      return html`
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div class="score-circle-wrap">
            <svg viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="45" fill="none" stroke="var(--bg3)" stroke-width="7"/>
              <circle
                cx="50" cy="50" r="45" fill="none"
                stroke=${color} stroke-width="7" stroke-linecap="round"
                stroke-dasharray=${circumference}
                stroke-dashoffset=${offset}
                class="ring-animated"
                style=${'filter:drop-shadow(0 0 6px ' + color + ')'}
              />
            </svg>
            <div class="score-number">
              <span class="score-num" style=${'color:' + color}>${score}</span>
              <span class="score-label-small">/ 100</span>
            </div>
          </div>
          <span class=${'score-grade ' + grade}>${gradeLabel}</span>
        </div>
      `;
    }

    // ── Loading Panel ─────────────────────────────────────────────
    function LoadingPanel({ step }) {
      const steps = [
        'Parsing resume content…',
        'Matching against target role…',
        'Scoring strengths & gaps…',
        'Generating recommendations…',
      ];
      return html`
        <div class="loading-overlay">
          <div class="radar-ring">
            <svg viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="32" fill="none" stroke="var(--bg3)" stroke-width="4"/>
              <circle cx="40" cy="40" r="32" fill="none" stroke="var(--accent)" stroke-width="4"
                stroke-linecap="round" stroke-dasharray="56 145"/>
            </svg>
            <div class="radar-inner">🤖</div>
          </div>
          <div class="loading-title">AI is reviewing your resume…</div>
          <div class="loading-sub">Gemini is analysing every line. This takes ~10 seconds.</div>
          <div class="loading-steps">
            ${steps.map((s, i) => html`
              <div key=${i} class=${'loading-step' + (i === step ? ' active' : i < step ? ' done' : '')}>
                <div class="step-dot"></div>
                ${s}
              </div>
            `)}
          </div>
        </div>
      `;
    }

    // ── Results Dashboard ─────────────────────────────────────────
    function ResultsDashboard({ result, copied, onCopy }) {
      const {
        overallScore = 0, verdict = '',
        strengths = [], gaps = [],
        atsKeywords = {}, rewrittenSummary = '',
        topRecommendations = [],
      } = result;
      const { found = [], missing = [] } = atsKeywords;

      const barColor = overallScore >= 75
        ? 'linear-gradient(90deg,var(--green),#34D399)'
        : overallScore >= 50
        ? 'linear-gradient(90deg,var(--amber),#FCD34D)'
        : 'linear-gradient(90deg,var(--red),#F87171)';

      return html`
        <div class="results-panel">

          <!-- Score hero -->
          <div class="score-hero fade-in">
            <${ScoreCircle} score=${overallScore}/>
            <div class="score-info">
              <div style="font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">
                Overall Match
              </div>
              <div class="score-bar-wrap">
                <div class="score-bar-fill" style=${'width:' + overallScore + '%;background:' + barColor}></div>
              </div>
              <div class="verdict-text">"${verdict}"</div>
            </div>
          </div>

          <!-- Strengths + Gaps -->
          <div class="two-col fade-in-2">
            <div class="result-card">
              <div class="card-header green">✓ Strengths</div>
              <div class="item-list">
                ${strengths.map((s, i) => html`
                  <div key=${i} class="item-row">
                    <div class="item-bullet green"></div>${s}
                  </div>`)}
              </div>
            </div>
            <div class="result-card">
              <div class="card-header red">⚠ Gaps</div>
              <div class="item-list">
                ${gaps.map((g, i) => html`
                  <div key=${i} class="item-row">
                    <div class="item-bullet red"></div>${g}
                  </div>`)}
              </div>
            </div>
          </div>

          <!-- ATS Keywords -->
          <div class="ats-card fade-in-3">
            <div class="card-header cyan" style="margin-bottom:16px">◈ ATS Keywords</div>
            <div class="ats-sections">
              <div>
                <div class="ats-group-label found">✓ Found in resume</div>
                <div class="chips">
                  ${found.length
                    ? found.map((k, i) => html`<span key=${i} class="chip found">${k}</span>`)
                    : html`<span style="font-size:12px;color:var(--text3)">None detected</span>`}
                </div>
              </div>
              <div>
                <div class="ats-group-label missing">✗ Missing</div>
                <div class="chips">
                  ${missing.length
                    ? missing.map((k, i) => html`<span key=${i} class="chip missing">${k}</span>`)
                    : html`<span style="font-size:12px;color:var(--text3)">None — great job!</span>`}
                </div>
              </div>
            </div>
          </div>

          <!-- Rewritten Summary -->
          <div class="summary-card fade-in-4">
            <div class="card-header accent" style="margin-bottom:14px">✎ AI-Rewritten Summary</div>
            <div class="summary-body">${rewrittenSummary}</div>
            <button class=${'copy-btn' + (copied ? ' copied' : '')} onClick=${onCopy}>
              ${copied ? '✓ Copied!' : '⎘ Copy summary'}
            </button>
          </div>

          <!-- Recommendations -->
          <div class="recs-card fade-in-5">
            <div class="card-header amber" style="margin-bottom:14px">⚡ Top Recommendations</div>
            ${topRecommendations.map((rec, i) => html`
              <div key=${i} class="rec-item">
                <div class="rec-num">0${i + 1}</div>
                <div class="rec-text">${rec}</div>
              </div>`)}
          </div>

        </div>
      `;
    }

    // ── Main App ──────────────────────────────────────────────────
    function App() {
      const [apiKey, setApiKey]         = useState('');
      const [resumeText, setResumeText] = useState('');
      const [jobRole, setJobRole]       = useState('');
      const [pdfName, setPdfName]       = useState('');
      const [loading, setLoading]       = useState(false);
      const [loadStep, setLoadStep]     = useState(0);
      const [result, setResult]         = useState(null);
      const [error, setError]           = useState('');
      const [copied, setCopied]         = useState(false);
      const [dragOver, setDragOver]     = useState(false);
      const fileRef = useRef(null);

      // Advance loading steps while waiting
      useEffect(() => {
        if (!loading) return;
        setLoadStep(0);
        const t = [
          setTimeout(() => setLoadStep(1), 2200),
          setTimeout(() => setLoadStep(2), 4800),
          setTimeout(() => setLoadStep(3), 7500),
        ];
        return () => t.forEach(clearTimeout);
      }, [loading]);

      // PDF extraction
      const extractPdf = useCallback(async (file) => {
        if (!file || file.type !== 'application/pdf') {
          setError('Please upload a valid PDF file.'); return;
        }
        try {
          const buf = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          let text = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(it => it.str).join(' ') + '\n';
          }
          setResumeText(text.trim());
          setPdfName(file.name);
          setError('');
        } catch (err) {
          setError('PDF extraction failed. Open your PDF in Chrome/Edge, press Ctrl+A then Ctrl+C, and paste the text into the box above instead.');
        }
      }, []);

      const onFileChange = (e) => { if (e.target.files[0]) extractPdf(e.target.files[0]); };
      const onDrop = (e) => {
        e.preventDefault(); setDragOver(false);
        if (e.dataTransfer.files[0]) extractPdf(e.dataTransfer.files[0]);
      };

      // ── Gemini API call ───────────────────────────────────────
      const analyze = async () => {
        if (!apiKey.trim())      { setError('Please enter your Gemini API key.'); return; }
        if (!resumeText.trim())  { setError('Please paste your resume or upload a PDF.'); return; }
        if (!jobRole.trim())     { setError('Please enter your target job role.'); return; }

        setError(''); setResult(null); setLoading(true);

        // Try models in order — fall back if one is overloaded, quota-exceeded, or unavailable
        const MODELS = [
          'gemini-2.5-flash',
          'gemini-2.0-flash-lite',
          'gemini-1.5-flash',
          'gemini-1.5-flash-8b',
        ];
        const RETRY_ERRORS = [
          'high demand', 'overloaded', 'quota', 'exceeded',
          'limit', '503', '429', 'not found', 'not supported', 'billing'
        ];

        try {
          let parsed = null;

          for (const model of MODELS) {
            let res;
            try {
              const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`;
              res = await fetch(url, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    parts: [{ text: `Resume:\n${resumeText}\n\nTarget Role: ${jobRole}` }]
                  }],
                  systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                  generationConfig: { maxOutputTokens: 2048, temperature: 0.3 }
                }),
              });
            } catch {
              continue; // network error, try next model
            }

            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              const msg = (errData.error?.message || `API error ${res.status}`).toLowerCase();
              const isRetryable = RETRY_ERRORS.some(e => msg.includes(e));
              if (isRetryable) continue; // try next model
              throw new Error(errData.error?.message || `API error ${res.status}`);
            }

            const data = await res.json();
            if (!data.candidates?.length) continue; // try next model

            const parts = data.candidates[0]?.content?.parts || [];
            const raw = parts.map(p => p.text || '').join('');
            if (!raw) continue;

            const jsonMatch = raw.match(/\{[\s\S]*\}/);
            if (!jsonMatch) continue;

            try {
              parsed = JSON.parse(jsonMatch[0]);
              break; // success — stop trying models
            } catch {
              continue;
            }
          }

          if (!parsed) throw new Error('All models are busy or unavailable. Please wait a moment and try again.');
          setResult(parsed);

        } catch (e) {
          setError(e.message || 'Something went wrong. Check your API key and try again.');
        } finally {
          setLoading(false);
        }
      };

      const copy = async () => {
        if (!result?.rewrittenSummary) return;
        const text = result.rewrittenSummary;
        try {
          if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
          } else {
            // Fallback for file:// where Clipboard API may be unavailable
            const el = document.createElement('textarea');
            el.value = text;
            el.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
            document.body.appendChild(el);
            el.focus(); el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
          }
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch { /* silent fail */ }
      };

      const canAnalyze = apiKey.trim() && resumeText.trim() && jobRole.trim() && !loading;

      return html`
        <div class="app-shell">

          <!-- ── Topbar ── -->
          <header class="topbar">
            <div class="logo">
              <div class="logo-icon">📄</div>
              <span class="logo-text">Resume<span>AI</span></span>
              <span class="logo-badge">Free</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px;flex:1;min-width:260px;max-width:500px">
              <div class="api-row">
                <div class="api-input-wrap">
                  <span class="api-key-icon">🔑</span>
                  <input
                    class="api-input"
                    type="password"
                    placeholder="AIzaSy… — Gemini API key"
                    value=${apiKey}
                    onInput=${e => setApiKey(e.target.value)}
                    spellcheck="false"
                  />
                </div>
                <div class=${'api-status ' + (apiKey.trim() ? 'has-key' : 'no-key')}
                     title=${apiKey.trim() ? 'Key set ✓' : 'No key entered'}></div>
              </div>
              <div class="api-hint">
                Free key → <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com/app/apikey</a>
              </div>
            </div>
          </header>

          <!-- ── Main grid ── -->
          <div class="main-grid">

            <!-- Left: Input panel -->
            <div style="display:flex;flex-direction:column;gap:20px">

              <!-- Resume -->
              <div class="panel">
                <div class="panel-title">📄 Your Resume</div>
                <textarea
                  class="resume-textarea"
                  placeholder="Paste your full resume text here… Include work experience, skills, education, and projects."
                  value=${resumeText}
                  onInput=${e => { setResumeText(e.target.value); setPdfName(''); }}
                ></textarea>
                <div class=${'char-count' + (resumeText ? ' has-text' : '')}>
                  ${resumeText.length.toLocaleString()} characters
                </div>

                <div class="or-divider"><span>or upload PDF</span></div>

                ${pdfName
                  ? html`
                    <div class="pdf-success">
                      <span>📄</span>
                      <span><strong>${pdfName}</strong> — extracted successfully</span>
                      <button class="pdf-close" onClick=${() => { setPdfName(''); setResumeText(''); }}>×</button>
                    </div>`
                  : html`
                    <div
                      class=${'drop-zone' + (dragOver ? ' drag-over' : '')}
                      onClick=${() => fileRef.current && fileRef.current.click()}
                      onDragOver=${e => { e.preventDefault(); setDragOver(true); }}
                      onDragLeave=${() => setDragOver(false)}
                      onDrop=${onDrop}
                    >
                      <div class="drop-zone-icon">📂</div>
                      <p><span>Click to upload</span> or drag & drop</p>
                      <small>PDF only — text extracted locally, nothing uploaded</small>
                    </div>`
                }
                <input ref=${fileRef} class="hidden-file" type="file" accept=".pdf" onChange=${onFileChange}/>
              </div>

              <!-- Role -->
              <div class="panel">
                <div class="panel-title">🎯 Target Role</div>
                <input
                  class="role-input"
                  type="text"
                  placeholder="e.g. Prompt Engineer at an AI startup"
                  value=${jobRole}
                  onInput=${e => setJobRole(e.target.value)}
                  onKeyDown=${e => e.key === 'Enter' && canAnalyze && analyze()}
                />
                <div class="role-hint">
                  Be specific — e.g. <span>"Senior ML Engineer at a Series B company"</span>
                </div>
              </div>

              ${error && html`
                <div class="error-box">
                  <span>⚠</span><span>${error}</span>
                </div>`}

              <button class="analyze-btn" onClick=${analyze} disabled=${!canAnalyze}>
                ✦ ${loading ? 'Analysing…' : 'Analyse Resume'}
              </button>
            </div>

            <!-- Right: Results -->
            <div>
              ${loading
                ? html`<${LoadingPanel} step=${loadStep}/>`
                : result
                ? html`<${ResultsDashboard} result=${result} copied=${copied} onCopy=${copy}/>`
                : html`
                  <div class="empty-panel">
                    <div class="empty-icon">🎯</div>
                    <div class="empty-title">Your analysis will appear here</div>
                    <div class="empty-sub">
                      Paste your resume, set the target role, add your free Gemini key, and hit Analyse.
                    </div>
                  </div>`}
            </div>

          </div>
        </div>
      `;
    }

    // ── Mount ─────────────────────────────────────────────────────
    render(html`<${App}/>`, document.getElementById('root'));
  </script>
</body>
</html>
